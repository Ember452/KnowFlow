repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        # 用项目 venv 跑 mypy, 避免在 additional_dependencies 维护依赖列表
        # (P3 引入 markdown/python-docx/pymupdf 等无 stubs 库, 隔离环境报 import-untyped)
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        # src layout 下需 --explicit-package-bases 才能正确解析 knowflow 顶层包;
        # pass_filenames=false 避免 hook 把单文件路径传给 mypy 触发 duplicate module 误报
        args: [--explicit-package-bases, src/, worker/]
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
