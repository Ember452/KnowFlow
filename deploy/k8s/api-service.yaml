# KnowFlow API Service
apiVersion: v1
kind: Service
metadata:
  name: knowflow-api
  namespace: knowflow
  labels:
    app.kubernetes.io/name: knowflow
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knowflow
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
