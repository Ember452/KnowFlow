# KnowFlow 敏感配置模板(Secrets)
# 使用方法:
#   cp secrets.example.yaml secrets.yaml
#   填写真实值后用 base64 编码(Kubernetes Secret 值必须是 base64):
#     echo -n "sk-xxx" | base64
#   然后 kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: knowflow-secrets
  namespace: knowflow
type: Opaque
stringData:
  # 部署时替换为真实值(stringData 模式无需手动 base64)
  KNOWFLOW_POSTGRES_USER: "knowflow"
  KNOWFLOW_POSTGRES_PASSWORD: "CHANGE_ME"
  KNOWFLOW_REDIS_PASSWORD: ""
  KNOWFLOW_MINIO_ACCESS_KEY: "minioadmin"
  KNOWFLOW_MINIO_SECRET_KEY: "CHANGE_ME"
  KNOWFLOW_LLM_API_KEY: "CHANGE_ME"
