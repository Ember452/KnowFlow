# KnowFlow API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowflow-api
  namespace: knowflow
  labels:
    app.kubernetes.io/name: knowflow
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: knowflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowflow
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: ghcr.io/ember452/knowflow/knowflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: knowflow-config
            - secretRef:
                name: knowflow-secrets
          env:
            - name: KNOWFLOW_TASK_CONSUMER_NAME
              value: "api-$(POD_NAME)"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
