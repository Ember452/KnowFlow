[project]
name = "knowflow"
version = "0.1.0"
description = "KnowFlow - 企业知识库 Agent 平台（混合检索 + 工具治理 + Multi-Agent 编排）"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "KnowFlow" }]
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",  # FastAPI UploadFile 依赖
    # Agent 编排
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    # 检索
    "pymilvus>=2.4",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    # 存储（async 栈只用 asyncpg，不再装 psycopg2-binary）
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "redis>=5.0",
    "minio>=7.2",
    # 文档解析
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown>=3.7",
    # 工具与配置
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "structlog>=24.4",
    "pyyaml>=6.0",
    # 可观测
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary]>=3.3.4",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "pre-commit>=3.8",
    "aiosqlite>=0.20",  # SQLite 异步驱动，用于 repo 单测
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowflow"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# ─────────────────────────── 工程门禁配置 ───────────────────────────

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts", "worker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# tests 允许断言风格与裸 except 提示
"tests/**" = ["S101"]
# eval 脚本需在 import 前设置环境变量(如 chunk_size), 允许非顶层 import 与宽松排序
"eval/scripts/**" = ["E402", "I001"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src/knowflow"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
